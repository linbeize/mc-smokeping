# /etc/apache2/conf-available/mc3.conf  →  a2enconf mc3 && systemctl reload apache2
# 禁止直接访问内部库、命令行脚本（AllowOverride None 时 .htaccess 不生效，必须用这个）
<Directory /var/www/html/lib>
    Require all denied
</Directory>
<Directory /var/www/html/data>
    Require all denied
</Directory>
<FilesMatch "^(rrd_probe|rrd_init|cli)\.php$|^README\.md$">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>
